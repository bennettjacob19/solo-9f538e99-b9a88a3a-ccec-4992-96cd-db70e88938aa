services:
  origin-a:
    build: .
    image: layer-check-drill:latest
    command:
      - uvicorn
      - app.origin_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      DRILL_LAYER_BYTES: "8388608"
      DRILL_ORIGIN_CHUNK_BYTES: "65536"
      DRILL_ORIGIN_SEED: "20261124"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

  origin-b:
    build: .
    image: layer-check-drill:latest
    command:
      - uvicorn
      - app.origin_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    environment:
      DRILL_LAYER_BYTES: "8388608"
      DRILL_ORIGIN_CHUNK_BYTES: "65536"
      # Same seed as A: both baselines (v1) are byte-identical.
      DRILL_ORIGIN_SEED: "20261124"
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build: .
    image: layer-check-drill:latest
    command:
      - uvicorn
      - app.gateway_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DRILL_ORIGIN_A: "http://origin-a:8001"
      DRILL_ORIGIN_B: "http://origin-b:8002"
      DRILL_LAYER_BYTES: "8388608"
    ports:
      - "8000:8000"
    depends_on:
      origin-a:
        condition: service_healthy
      origin-b:
        condition: service_healthy
